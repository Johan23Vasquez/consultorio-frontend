<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Paciente</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/nuevo_paciente.css">
</head>
<body>

    <div class="bg-blob bg-blob--1" aria-hidden="true"></div>
    <div class="bg-blob bg-blob--2" aria-hidden="true"></div>

    <div class="page">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="topbar__logo">
                <div class="topbar__mark">⚕</div>
                <span>Consultorio Médico</span>
            </div>
            <button class="cancelar" onclick="window.location.href='index.html'">← Cancelar</button>
        </header>

        <!-- FORM CARD -->
        <div class="form-card">

            <!-- HEADER -->
            <div class="form-header">
                <div class="form-header__left">
                    <div class="form-header__icon">🧑‍⚕️</div>
                    <div>
                        <h2>Datos del Paciente</h2>
                        <p class="form-header__sub">Registro de nuevo expediente</p>
                    </div>
                </div>
            </div>

            <!-- FORM -->
            <form id="formPaciente">

                <div class="form-section-title">
                    <span>Información personal</span>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre completo <span class="required">*</span></label>
                    <input type="text" id="nombre" placeholder="Ej. María García López" required>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" step="0.01" min="0" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label for="sexo">Sexo</label>
                        <select id="sexo">
                            <option value="">Seleccionar…</option>
                            <option value="Femenino">Femenino</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="peso">Peso (kg)</label>
                        <input type="text" id="peso" placeholder="Ej. 65">
                    </div>
                    <div class="form-group">
                        <label for="altura">Altura (cm)</label>
                        <input type="text" id="altura" placeholder="Ej. 165">
                    </div>
                </div>

                <div class="form-section-title">
                    <span>Contacto y responsable</span>
                </div>

                <div class="form-group">
                    <label for="tutor">Nombre del tutor o responsable</label>
                    <input type="text" id="tutor" placeholder="Ej. Pedro García (padre)">
                </div>

                <div class="form-group">
                    <label for="telefono">Número telefónico</label>
                    <input type="tel" id="telefono" placeholder="Ej. 55 1234 5678">
                </div>

                <div class="form-section-title">
                    <span>Notas adicionales</span>
                </div>

                <div class="form-group">
                    <label for="info">Información adicional</label>
                    <textarea rows="4" id="info" placeholder="Alergias, antecedentes, observaciones…"></textarea>
                </div>

                <button type="submit" class="btn">
                    <span class="btn__icon">✓</span>
                    Guardar Paciente
                </button>

            </form>
        </div><!-- /form-card -->
    </div><!-- /page -->

<script src="js/nuevo_paciente.js"></script>
</body>
</html>
